name: report example secret

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      EXAMPLE: ${{ secrets.EXAMPLE }}
    steps:
      - name: Report trigger context
        run: |
          echo "actor=$GITHUB_ACTOR"
          echo "event=$GITHUB_EVENT_NAME"
          echo "pr_author=${{ github.event.pull_request.user.login }}"

      - name: Run nested deployment fixture
        run: |
          bash -lc '
            set -o pipefail
            make deploy 2>&1 | tee "${{ runner.temp }}/deploy.log"
          '
