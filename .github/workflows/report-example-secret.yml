name: report example secret

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      EXAMPLE: ${{ secrets.EXAMPLE }}
    steps:
      - name: Report trigger context
        run: |
          echo "actor=$GITHUB_ACTOR"
          echo "event=$GITHUB_EVENT_NAME"
          echo "pr_author=${{ github.event.pull_request.user.login }}"

      - name: Report whether EXAMPLE is available
        run: |
          if [[ -n "$EXAMPLE" ]]; then
            echo "EXAMPLE is available"
          else
            echo "EXAMPLE is unavailable"
          fi
